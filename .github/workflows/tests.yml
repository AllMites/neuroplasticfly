name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ponytail: CPU torch + numpy + scipy (rate engine); tests needing the built brain (data/) or CUDA stay manual; test_small_graph.py covers the engines on a synthetic circuit (#4)
      - run: pip install numpy scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: |
          python regime/test_reach.py
          python regime/test_sfa.py
          python regime/test_weights.py
          python test_prereg.py
          python reproduce_paper1.py --verify
          python test_small_graph.py
