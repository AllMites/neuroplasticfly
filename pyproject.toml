# Host-only (Windows/Linux + uv + CUDA). Torch cu128 is mandatory: the sim is one flat
# CUDA tensor. The chess-era Docker path (Dockerfile, compose.yaml) is kept for the
# record and is not needed by reproduce.py.
[project]
name = "neuroplasticfly"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "chess==1.11.2",
    "pyarrow>=16",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "trimesh>=5.1.0",
    "matplotlib>=3.8",                      # learn/condition.py plot(); paper1/ figures
    "pandas>=2.2",                          # rate/sugar_fox_anatomy.py, rate/gain_bound.py (paper 1)
    "triton-windows>=3.8 ; sys_platform == 'win32'",  # torch.compile backend; gpu_sim.py:458 falls back to eager without it
    "flypoke @ git+https://github.com/vshapenko/flypoke@24814fe83224ca2d25c116c1107440b877b07762",  # scripts/build_data.py loader only
]

[project.scripts]
neuroplasticfly-reproduce = "neuroplasticfly:_reproduce"
neuroplasticfly-reproduce-paper1 = "reproduce_paper1:main"
neuroplasticfly-prereg = "prereg:main"

[project.optional-dependencies]
# rate/gain_bound.py only: recomputes the gain cap (rate/gain_bound.json ships) from a sibling flyvis checkout.
flyvis-cap = ["h5py>=3.11"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The code stays at the paths PROVENANCE.json hashes; neuroplasticfly/ aliases it (see its docstring).
[tool.setuptools]
# reservoir, encode, precompute_gpu: imported lazily by gpu_sim (GpuSim() with no brain argument, warm-up)
py-modules = ["gpu_sim", "prereg", "reproduce", "reproduce_paper1", "reservoir", "encode", "precompute_gpu"]
packages = ["neuroplasticfly", "learn", "rate", "regime"]
